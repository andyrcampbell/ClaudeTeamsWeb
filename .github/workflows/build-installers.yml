name: Build installers

# Produces an unsigned Windows .exe (NSIS) and macOS .dmg (x64 + arm64) via
# electron-builder. Runs on pushes to `release` and on version tags; version
# tags additionally attach the installers to a draft GitHub Release for
# review before publishing. This is a build/artifact pipeline for the
# teammate-testing milestone — no code signing or notarization yet.
#
# Notes on two things that are deliberate:
# - `--publish never`: with a tag present electron-builder otherwise tries to
#   publish to GitHub Releases itself and fails on a missing GH_TOKEN. The
#   draft-release job below owns publishing.
# - `windows-2025`: `windows-latest` ships Visual Studio 18, which the
#   node-gyp bundled with @electron/rebuild cannot identify ("unknown version
#   undefined"), so the node-pty rebuild fails. VS 2022 on this image works.
# There is no explicit electron-rebuild step: electron-builder rebuilds
# native deps (node-pty) against its own Electron version by itself.

on:
  push:
    branches: [release]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx electron-builder --mac --x64 --arm64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: dist/*.dmg

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            artifacts/windows-installer/*.exe
            artifacts/mac-installer/*.dmg
